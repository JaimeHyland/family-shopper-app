{% extends "base.html" %}

{% block content %}

<div class="category detail">
    <form method="post" action="" class="w-100">
        {% csrf_token %}
        <div class="form-group">
            <label for="category_name">Category:</label>
            <p class="mx-3">{{ form.category_name }}</p>
        </div>
        <div class="form-group">
            <label for="notes">Notes:</label>
            <p class="mx-3">{{ form.notes }}</p>
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{% url 'category_list' family_public_id=request.family.public_id %}" class="btn btn-secondary">Cancel</a>
    </form>
    <form method="get" action="{% url 'category_delete' family_public_id=request.family.public_id slug=category.slug %}" class="w-100 mt-2">
        <button type="submit" class="btn btn-danger">Delete</button>
    </form>
</div>

{% endblock %}
