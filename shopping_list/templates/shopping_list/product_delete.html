{% extends "base.html" %}

{% block content %}

<div class="col-12 mt-3">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <h3 class="mx-3">Delete product</h3>
      <form method="post" action="" class="w-100">
        {% csrf_token %}
        <p class="mx-3">Are you sure you want to delete "{{ product.product_name }}"?</p>
        <button type="submit" class="btn btn-danger">Confirm delete</button>
        <a href="{% url 'product_detail' family_slug=request.family.slug slug=product.slug %}" class="btn btn-secondary">Cancel</a>
      </form>
    </div>
  </div>
</div>

{% endblock %}
