{% extends "base.html" %}

{% block content %}

<div class="shop detail">
    <form method="post" action="" class="w-100">
        {% csrf_token %}
        <div class="form-group">
            <label for="shop_name">Shop:</label>
            <p class="mx-3">{{ form.shop_name }}</p>
        </div>
        <div class="form-group">
            <label for="type_of_shop">Type of shop:</label>
            <p class="mx-3">{{ form.type_of_shop }}</p>
        </div>
        <div class="form-group">
            <label for="notes">Notes:</label>
            <p class="mx-3">{{ form.notes }}</p>
        </div> 
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{% url 'shop_list' family_public_id=request.family.public_id %}" class="btn btn-secondary">Cancel</a>
    </form>
    <form method="get" action="{% url 'shop_delete' family_public_id=request.family.public_id slug=shop.slug %}" class="w-100 mt-2">
        <button type="submit" class="btn btn-danger">Delete</button>
    </form>
</div>

{% endblock %}
