<li class="list-group-item d-flex align-items-center p-0 product-row" data-product-id="{{ product.id }}">
  <form method="post" action="{% url 'add_to_shopping_list' family_slug=request.family.slug %}" class="product-add-form flex-grow-1 m-0">
    {% csrf_token %}
    <input type="hidden" name="selected-products" value="{{ product.id }}">
    <button type="submit" class="btn btn-link text-decoration-none text-reset product-add-btn w-100 text-start d-flex justify-content-between align-items-center px-3 py-2" title="Add to shopping list">
      <span class="product-name-text">{{ product.product_name }}</span>
      <span class="on-list-badge badge text-bg-light ms-2{% if not product.on_list_quantity %} d-none{% endif %}">On list &middot; <span class="on-list-quantity">{{ product.on_list_quantity|default_if_none:"" }}</span></span>
    </button>
  </form>
  <a href="{% url 'product_detail' family_slug=request.family.slug slug=product.slug %}" class="product-info-link px-3 py-2" aria-label="View details for {{ product.product_name }}" title="Product details">
    <i class="fas fa-info-circle" aria-hidden="true"></i>
  </a>
</li>
