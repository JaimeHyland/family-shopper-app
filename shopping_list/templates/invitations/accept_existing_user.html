{% extends "base.html" %}

{% block content %}
<div class="container">
    <h1>Join "{{ family_name }}"</h1>
    <p>This email address already belongs to your account. Confirm below to join this family.</p> {# noqa #}
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <div class="mb-3">
            <label for="{{ form.display_name.id_for_label }}" class="form-label">Your display name in this family (optional, defaults to your existing display name where possible)</label> {# noqa #}
            {{ form.display_name }}
            {{ form.display_name.errors }}
        </div>
        <button type="submit" class="btn btn-primary">Join family</button>
    </form>
</div>
{% endblock %}
